version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: meta
    cooldown:
      default-days: 3
    groups:
      # Fallback group for all minor/patch updates
      actions:
        update-types:
          - patch
          - minor
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: '/'
    versioning-strategy: increase
    schedule:
      interval: monthly
    commit-message:
      prefix: meta
    cooldown:
      default-days: 3
    groups:
      doc-kit:
        patterns:
          - '@doc-kit/*'
          - '@node-core/doc-kit'
      # Fallback groups for all other minor/patch updates
      production:
        dependency-type: production
        update-types:
          - patch
          - minor
      development:
        dependency-type: development
        update-types:
          - patch
          - minor
    open-pull-requests-limit: 10
