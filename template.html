<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>${title}</title>
    <meta property="og:title" content="${title}" />
    <meta property="og:type" content="website" />
    <link
      rel="canonical"
      href="https://nodejs.org/learn${metadata.path.replace('/index', '')}"
    />
    <style>
      is-land[data-island-name='Sidebar'] {
        display: flex;
        flex-direction: column;
      }
      is-land[data-island-name='Sidebar'] > aside {
        flex: 1 0 auto;
      }
      @media (min-width: 896px) {
        div[class] > is-land[data-island-name='Sidebar'] {
          height: 100svh;
        }
      }
    </style>

    <!-- The favicon, description and og: tags come from the preset's head -->
    ${preloads} ${assets} ${head}

    <!-- Apply theme before paint to avoid Flash of Unstyled Content -->
    <script>
      ${themeScript}
    </script>
    <script type="speculationrules">
      ${speculationRules}
    </script>
  </head>

  <body>
    <div id="root">${dehydrated}</div>
  </body>
</html>
